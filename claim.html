<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Nhận key</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#2a2f3a; --text:#e8eaf0; --mut:#8b93a5; --acc:#4f8cff; --ok:#3ecf8e; --err:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
  .card { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:24px; }
  h1 { font-size:20px; margin:0 0 6px; }
  p { color:var(--mut); font-size:14px; line-height:1.55; margin:0 0 14px; }
  #key { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:20px; letter-spacing:1px; text-align:center; padding:16px 8px; border:1px dashed var(--ok); border-radius:10px; color:var(--ok); background:#0f1115; word-break:break-all; margin:14px 0; user-select:all; }
  button { width:100%; padding:13px; border:0; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; color:#fff; background:var(--acc); }
  button.sec { background:#2a2f3a; margin-top:10px; }
  .err { color:var(--err); font-size:14px; line-height:1.5; }
  a { color:var(--acc); }
  .hide { display:none; }
</style>
</head>
<body>
<div class="card">
  <h1 id="title">Đang kiểm tra...</h1>
  <div id="loading"><p>Chờ chút, server đang xác nhận lượt vượt link của bạn.</p></div>

  <div id="okBox" class="hide">
    <p>Đây là key của bạn. Hãy lưu lại, và dán vào app để kích hoạt. Thời hạn <b id="dur"></b> tính từ lần kích hoạt đầu tiên.</p>
    <div id="key"></div>
    <button id="copy">Sao chép key</button>
    <p style="margin:14px 0 0;font-size:13px">Đổi máy? Vào <a href="/">trang reset thiết bị</a>.</p>
  </div>

  <div id="errBox" class="hide">
    <p class="err" id="errMsg"></p>
    <button id="retry" class="hide">Thử lại</button>
    <button class="sec" onclick="location.href='/get'">Về trang lấy key</button>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const LABEL = { '6h': '6 giờ', '1d': '1 ngày', '3d': '3 ngày', '7d': '7 ngày', '30d': '30 ngày' };
const qs = new URLSearchParams(location.search);
const t = qs.get('t') || '';
const k = qs.get('k') || '';

function showErr(msg, canRetry) {
  $('title').textContent = 'Chưa nhận được key';
  $('loading').classList.add('hide');
  $('errBox').classList.remove('hide');
  $('errMsg').textContent = msg;
  if (canRetry) $('retry').classList.remove('hide');
}

async function claim() {
  $('errBox').classList.add('hide'); $('loading').classList.remove('hide'); $('title').textContent = 'Đang kiểm tra...';
  try {
    const r = await fetch('/api/gate/claim', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t, k }) });
    const d = await r.json();
    if (!d.ok) return showErr(d.message || 'Có lỗi xảy ra.', d.code === 'TOO_FAST');
    if (d.next) {
      $('title').textContent = 'Xong link ' + (d.step || 1) + '/' + (d.total || 2);
      $('loading').innerHTML = '<p>Đang chuyển sang link tiếp theo, vượt tiếp để nhận key...</p>';
      setTimeout(() => { location.href = d.url; }, 1500);
      return;
    }
    $('title').textContent = 'Nhận key thành công';
    $('loading').classList.add('hide');
    $('okBox').classList.remove('hide');
    $('key').textContent = d.key;
    $('dur').textContent = LABEL[d.duration] || d.duration;
    try { localStorage.setItem('lastKey', d.key); } catch (e) {}
  } catch (e) {
    showErr('Không kết nối được server (nếu server mới thức dậy, chờ 30-60 giây rồi thử lại).', true);
  }
}

$('retry').onclick = claim;
$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText($('key').textContent); $('copy').textContent = 'Đã sao chép'; }
  catch (e) { $('copy').textContent = 'Giữ vào key để sao chép'; }
};
claim();
</script>
</body>
</html>
